<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Maskable: OS may crop up to 20% off each side. Safe zone is a
       centered 60%-diameter circle, so the letter is scaled down and
       inset to stay clear of any crop. -->
  <rect width="512" height="512" fill="#000000"/>

  <text x="256"
        y="352"
        font-family="Charter, Georgia, 'Times New Roman', serif"
        font-size="360"
        font-weight="500"
        fill="#E7E7EA"
        text-anchor="middle">t</text>

  <rect x="216" y="392" width="80" height="10" rx="2" fill="#CFA574"/>
</svg>
