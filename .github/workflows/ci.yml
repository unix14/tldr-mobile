# .github/workflows/ci.yml
#
# On every push and PR to main:
#   1. Static analysis
#   2. Web build (release)
#   3. Android debug APK build
#
# The APK gets uploaded as a workflow artifact so you can grab a fresh
# build without waiting for a tagged release.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: pub get
        run: flutter pub get

      - name: analyze
        run: flutter analyze

      - name: build web
        run: flutter build web --release

      - name: build android debug APK
        run: flutter build apk --debug

      - name: upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tldr-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
